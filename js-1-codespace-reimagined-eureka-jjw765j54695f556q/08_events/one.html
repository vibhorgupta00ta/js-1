<!-- In JavaScript, events are actions or occurrences that happen in the browser, which JS can detect and respond to.

🔹 What is an Event?

An event occurs when:

a user clicks a button

presses a key

moves the mouse

submits a form

a page loads

input value changes

JS listens to these events and runs code when they happen.

🔹 Common JavaScript Events
🖱️ Mouse Events
Event	Description
click	Mouse click
dblclick	Double click
mouseover	Mouse enters element
mouseout	Mouse leaves element
mousedown	Mouse button pressed
mouseup	Mouse button released
⌨️ Keyboard Events
Event	Description
keydown	Key pressed
keyup	Key released
keypress	Key pressed (old, less used)
📝 Form Events
Event	Description
submit	Form submitted
change	Input value changed
focus	Input focused
blur	Input loses focus
input	Value changes instantly
🌐 Window / Document Events
Event	Description
load	Page fully loaded
DOMContentLoaded	HTML loaded
resize	Window resized
scroll	Page scrolled
🔹 How to Handle Events
✅ 1. Using HTML attribute (Not Recommended)
<button onclick="alert('Clicked')">Click</button>

✅ 2. Using addEventListener() (BEST WAY)
const btn = document.querySelector("button");

btn.addEventListener("click", () => {
    console.log("Button clicked");
});

🔹 Event Object

JS automatically provides an event object with details.

btn.addEventListener("click", (event) => {
    console.log(event.target); // clicked element
});

🔹 Event Bubbling & Capturing
🔼 Bubbling (default)

Event goes child → parent

div.addEventListener("click", () => console.log("Div clicked"));
button.addEventListener("click", () => console.log("Button clicked"));

🔽 Capturing

Event goes parent → child

div.addEventListener("click", handler, true);

🔹 Prevent Default Behavior
form.addEventListener("submit", (e) => {
    e.preventDefault();
});

🔹 Event Delegation (Important for interviews 🔥)
document.querySelector("ul").addEventListener("click", (e) => {
    if (e.target.tagName === "LI") {
        console.log(e.target.innerText);
    }
}); -->
